name: SASjs Core Package Publish Tag
on:
  push:
    branches:
      - main
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Make Release
        uses: alice-biometrics/release-creator/@v1.0.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          draft: false
          version: 5.0.0
          description: 'Version 5.0.0 of sasjs/core is now on SAS PACKAGES ARCHIVE (SASPAC) :ok_hand:'
